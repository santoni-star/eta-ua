name: Build Debug APK

# Збірка debug APK без жодних секретів підпису.
# Наявний android-release.yml вимагає ETA_RELEASE_* секрети і падає без них,
# тому для тестових збірок використовується цей окремий workflow.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Зібрати debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Отримати код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Налаштувати JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Налаштувати Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-provider: basic

      - name: Налаштувати Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ""
          log-accepted-android-sdk-licenses: false

      - name: Встановити Android SDK 37
        shell: bash
        run: sdkmanager --channel=3 "platforms;android-37.0"

      - name: Зібрати debug APK
        run: |
          ./gradlew --no-daemon --no-configuration-cache \
            -Peta.buildMetadata=${GITHUB_SHA::7} \
            :app:assembleDebug

      - name: Перевірити локалізацію
        shell: bash
        run: |
          uk="app/src/main/res/values-uk/strings.xml"
          if [[ ! -f "$uk" ]]; then
            echo "::error::Не знайдено $uk"
            exit 1
          fi
          count=$(grep -c '<string ' "$uk" || true)
          echo "Українських рядків: $count"
          if grep -qP '[\x{4e00}-\x{9fff}]' "$uk"; then
            echo "::error::У values-uk/strings.xml залишилися китайські символи"
            exit 1
          fi
          echo "Перевірку локалізації пройдено"

      - name: Знайти APK
        id: apk
        shell: bash
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/debug/Eta-v*.apk)
          if [[ ${#apks[@]} -ne 1 ]]; then
            echo "::error::Очікувався 1 debug APK, знайдено ${#apks[@]}"
            ls -la app/build/outputs/apk/debug/ || true
            exit 1
          fi
          echo "path=${apks[0]}" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "${apks[0]}")" >> "$GITHUB_OUTPUT"
          ls -lh "${apks[0]}"

      - name: Завантажити APK як артефакт
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: eta-debug-apk
          path: ${{ steps.apk.outputs.path }}
          archive: false
          if-no-files-found: error
          retention-days: 30
